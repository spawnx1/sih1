<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash-out Forecast Console -- SIH26184</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(12,18,28,.66); --panel2:rgba(16,24,36,.7);
    --solid:#0a0f18; --line:rgba(84,150,180,.20); --line2:rgba(84,150,180,.34);
    --ink:#e2edf5; --dim:#8598ab; --faint:#5b6d80;
    --red:#ff5a6e; --amber:#ffbe4d; --green:#37e6a6; --cyan:#35e0e6; --accent:#35e0e6;
    --violet:#8a7bff;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --glow:0 0 18px rgba(53,224,230,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;
    font:13.5px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 520px at 86% -10%, rgba(53,224,230,.10), transparent 60%),
      radial-gradient(760px 520px at -6% 112%, rgba(138,123,255,.09), transparent 60%),
      linear-gradient(rgba(53,224,230,.035) 1px, transparent 1px) 0 0/42px 42px,
      linear-gradient(90deg, rgba(53,224,230,.035) 1px, transparent 1px) 0 0/42px 42px;
    animation:breathe 9s ease-in-out infinite alternate}
  @keyframes breathe{from{opacity:.72}to{opacity:1}}
  body::after{content:"";position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,10,14,.16) 3px)}
  .scanbar{position:fixed;left:0;right:0;height:140px;z-index:5;pointer-events:none;opacity:.05;
    background:linear-gradient(180deg,transparent,rgba(53,224,230,.9),transparent);animation:sweep 7.5s linear infinite}
  @keyframes sweep{0%{top:-20%}100%{top:120%}}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:7}
  .hud i{position:absolute;width:24px;height:24px;border:2px solid rgba(53,224,230,.45);filter:drop-shadow(0 0 4px rgba(53,224,230,.5))}
  .hud i:nth-child(1){top:9px;left:9px;border-right:0;border-bottom:0}
  .hud i:nth-child(2){top:9px;right:9px;border-left:0;border-bottom:0}
  .hud i:nth-child(3){bottom:9px;left:9px;border-right:0;border-top:0}
  .hud i:nth-child(4){bottom:9px;right:9px;border-left:0;border-top:0}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(53,224,230,.22);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(53,224,230,.42)}

  .mono{font-family:var(--mono)}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}

  header{position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(10,16,25,.9),rgba(6,9,15,.7));
    backdrop-filter:blur(10px);overflow:hidden}
  header::after{content:"";position:absolute;left:-40%;bottom:0;width:40%;height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);filter:drop-shadow(0 0 6px var(--cyan));animation:hscan 5.5s linear infinite}
  @keyframes hscan{0%{left:-40%}100%{left:100%}}
  .brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:1.5px;
    font-family:var(--mono);font-size:15px;text-shadow:0 0 14px rgba(53,224,230,.35)}
  .brand .dotlogo{width:11px;height:11px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 12px var(--cyan),0 0 24px rgba(53,224,230,.6);animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  .brand small{color:var(--faint);font-weight:400;letter-spacing:.5px;font-family:system-ui}
  .chips{margin-left:auto;display:flex;gap:18px;align-items:center;font-family:var(--mono);font-size:12px}
  .chip{display:flex;align-items:center;gap:6px;color:var(--dim)}
  .chip b{color:var(--ink)}
  .sw{width:9px;height:9px;border-radius:50%}
  .sw.RED{background:var(--red);box-shadow:0 0 8px var(--red)}
  .sw.AMBER{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .sw.GREY{background:var(--faint)}

  .app{position:relative;z-index:3;display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 54px)}
  .app.railmin{grid-template-columns:0 1fr}
  .app.railmin .rail{opacity:0;pointer-events:none}
  .app.railmin .stagehead{padding-left:104px}   /* clear the floating CASES button */

  .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;background:rgba(8,12,19,.55);backdrop-filter:blur(8px);transition:opacity .2s ease}
  .railbtn{cursor:pointer;color:var(--faint);font-family:var(--mono);font-size:13px;line-height:1;padding:4px 8px;border:1px solid var(--line);border-radius:6px;margin-left:8px}
  .railbtn:hover{color:var(--cyan);border-color:var(--cyan)}
  .railopen{position:fixed;left:12px;top:64px;z-index:20;display:none;background:rgba(10,16,25,.94);
    color:var(--cyan);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-family:var(--mono);
    font-size:11px;letter-spacing:1.4px;cursor:pointer;box-shadow:0 0 16px rgba(53,224,230,.25)}
  .railopen:hover{border-color:var(--cyan);box-shadow:0 0 22px rgba(53,224,230,.45)}
  .atgl{cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;color:var(--dim);
    font-family:var(--mono);font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:7px}
  .atgl:hover{border-color:var(--cyan);color:var(--ink)}
  .atgl.off{opacity:.55;border-style:dashed}
  .rail .head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 9px}
  .rail select{background:var(--solid);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11px;font-family:var(--mono)}
  .cases{overflow:auto;padding:6px 10px 14px;min-height:0}
  .case{position:relative;display:grid;grid-template-columns:6px 1fr auto;gap:11px;align-items:center;
    padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;
    cursor:pointer;background:rgba(12,18,28,.5);transition:transform .15s,border-color .15s,box-shadow .15s}
  .case::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(53,224,230,.08));opacity:0;transition:.15s}
  .case:hover{border-color:var(--line2);transform:translateY(-1px)}
  .case:hover::after{opacity:1}
  .case.sel{border-color:var(--cyan);background:rgba(14,26,34,.8);box-shadow:var(--glow),0 0 0 1px rgba(53,224,230,.3) inset}
  .case .bar{width:6px;height:40px;border-radius:6px}
  .case .cid{font-family:var(--mono);font-weight:650;font-size:13px}
  .case .ftype{color:var(--faint);font-size:11px;font-family:var(--mono)}
  .case .cmeta{color:var(--dim);font-size:11.5px;margin-top:2px}
  .case .risk{font-family:var(--mono);font-weight:750;font-size:16px;text-align:right;text-shadow:0 0 12px currentColor}
  .case .risk small{display:block;font-size:9px;color:var(--faint);font-weight:400;letter-spacing:1px;text-shadow:none}

  .stage{overflow:auto;min-height:0;padding:18px 20px 28px}
  .stagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .stagehead .cid{font-family:var(--mono);font-size:22px;font-weight:900;letter-spacing:1px}
  .stagehead .ftype{color:var(--faint);font-family:var(--mono);font-size:12px}
  .tier{font-family:var(--mono);font-size:11px;font-weight:800;padding:5px 11px;border-radius:6px;letter-spacing:2px}
  .tier.RED{background:rgba(255,90,110,.14);color:var(--red);box-shadow:0 0 0 1px rgba(255,90,110,.5) inset,0 0 16px rgba(255,90,110,.25)}
  .tier.AMBER{background:rgba(255,190,77,.13);color:var(--amber);box-shadow:0 0 0 1px rgba(255,190,77,.5) inset,0 0 16px rgba(255,190,77,.2)}
  .tier.GREY{background:rgba(91,109,128,.18);color:#9fb0c2;box-shadow:0 0 0 1px rgba(91,109,128,.45) inset}

  .replay{margin-left:auto;display:flex;align-items:center;gap:11px}
  .replay .clock{font-family:var(--mono);font-size:15px;font-weight:700;min-width:88px;text-align:right;color:var(--cyan);text-shadow:0 0 12px rgba(53,224,230,.5)}
  .replay input[type=range]{width:150px;accent-color:var(--cyan)}
  .btn{background:linear-gradient(180deg,#3ff0f6,#22c3c9);color:#04181a;border:0;border-radius:8px;padding:9px 14px;
    font-weight:750;cursor:pointer;font-size:12px;font-family:var(--mono);letter-spacing:.5px;box-shadow:0 0 16px rgba(53,224,230,.3);transition:.15s}
  .btn:hover{filter:brightness(1.1);box-shadow:0 0 22px rgba(53,224,230,.5)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none}
  .btn.ghost{background:rgba(16,26,36,.8);color:var(--ink);border:1px solid var(--line2);box-shadow:none}

  /* JARVIS briefing */
  .jarvis{position:relative;border:1px solid var(--line2);border-radius:14px;padding:14px 16px 15px 18px;margin-bottom:16px;
    background:linear-gradient(180deg,rgba(14,26,34,.7),rgba(10,16,24,.55));backdrop-filter:blur(6px);
    box-shadow:var(--glow);animation:fadeUp .3s ease both;overflow:hidden}
  .jarvis::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
  .jhead{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
  .jhead .rc{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:blink 1.6s ease-in-out infinite}
  .jhead .sp{margin-left:auto;cursor:pointer;background:rgba(16,26,36,.85);border:1px solid var(--line2);border-radius:6px;padding:2px 9px;font-size:14px;line-height:1.4}
  .jhead .sp:hover{border-color:var(--cyan)}
  .jtext{font-size:14px;line-height:1.6;color:var(--ink);min-height:46px}
  .jtext .cur{color:var(--cyan);animation:blink 1s step-end infinite;font-weight:700}
  .jlive{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:7px;min-height:14px;letter-spacing:.5px}
  .jsteps{margin-top:11px;display:grid;gap:7px}
  .jstep{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--dim);line-height:1.45}
  .jstep b{font-family:var(--mono);color:#04181a;background:var(--cyan);min-width:20px;height:20px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 0 10px rgba(53,224,230,.45);flex:0 0 auto;margin-top:1px}
  .jstep.red b{background:var(--red);box-shadow:0 0 10px var(--red);color:#1a0206}
  .jstep.ev b{background:var(--violet);box-shadow:0 0 10px var(--violet);color:#0a0618}
  .jstep.ev span b{background:none;box-shadow:none;color:var(--ink);display:inline;min-width:0;height:auto;padding:0}

  .action{position:relative;border-radius:14px;padding:16px 18px;margin-bottom:16px;overflow:hidden;display:flex;align-items:center;gap:16px;animation:fadeUp .28s ease both}
  .action::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .action.RED{background:linear-gradient(90deg,rgba(255,90,110,.16),transparent 70%);border:1px solid rgba(255,90,110,.4)}
  .action.RED::before{background:var(--red);box-shadow:0 0 18px var(--red)}
  .action.AMBER{background:linear-gradient(90deg,rgba(255,190,77,.14),transparent 70%);border:1px solid rgba(255,190,77,.4)}
  .action.AMBER::before{background:var(--amber);box-shadow:0 0 18px var(--amber)}
  .action.GREY{background:linear-gradient(90deg,rgba(91,109,128,.14),transparent 70%);border:1px solid var(--line2)}
  .action.GREY::before{background:var(--faint)}
  .action .big{font-size:23px;font-weight:800;letter-spacing:1px;font-family:var(--mono);text-shadow:0 0 16px currentColor}
  .action .why{color:var(--dim);font-size:12px;margin-top:4px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
  .kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;overflow:hidden;backdrop-filter:blur(6px);animation:fadeUp .28s ease both}
  .kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}
  .kpi::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--cyan),transparent);box-shadow:0 0 10px var(--cyan)}
  .kpi .v{font-family:var(--mono);font-size:27px;font-weight:750;line-height:1.05;margin-top:8px;text-shadow:0 0 14px currentColor;transition:color .25s}
  .kpi .s{color:var(--dim);font-size:11.5px;margin-top:5px}

  .cols{display:grid;grid-template-columns:1fr 360px;gap:14px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;backdrop-filter:blur(6px);animation:fadeUp .3s ease both}
  .card h3{margin:0 0 4px;font-family:var(--mono);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#c6d6e4;font-weight:800}
  .card .cap{color:var(--faint);font-size:11px;margin-bottom:8px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .maphold{position:relative;height:400px;border-radius:11px;overflow:hidden;background:#070b12;border:1px solid var(--line)}
  .maphold::before{content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(rgba(53,224,230,.055) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(53,224,230,.055) 1px,transparent 1px) 0 0/30px 30px}
  .maphold::after{content:"";position:absolute;top:50%;left:50%;width:150%;height:150%;z-index:0;transform-origin:top left;
    transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,rgba(53,224,230,.12),transparent 22%);animation:radar 7s linear infinite}
  @keyframes radar{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .maphold>svg{position:relative;z-index:1}
  #mapg{transition:transform .6s cubic-bezier(.4,.1,.2,1)}
  #map circle.hot{animation:cellpulse 1.5s ease-in-out infinite}
  @keyframes cellpulse{0%,100%{filter:drop-shadow(0 0 2px rgba(255,255,255,.6))}50%{filter:drop-shadow(0 0 9px rgba(255,255,255,.95))}}
  svg{width:100%;height:100%;display:block}
  .mapbtn{position:absolute;right:11px;top:11px;z-index:4;background:rgba(6,10,16,.85);border:1px solid var(--line2);
    color:var(--ink);border-radius:7px;padding:5px 10px;font-size:10px;font-family:var(--mono);letter-spacing:1px;cursor:pointer}
  .mapbtn:hover{border-color:var(--cyan);color:var(--cyan)}
  .legend{position:absolute;right:11px;bottom:11px;z-index:3;background:rgba(6,10,16,.82);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:10px;color:var(--dim);backdrop-filter:blur(4px)}
  .legend .ramp{height:9px;width:120px;border-radius:5px;margin:3px 0;background:linear-gradient(90deg,#37e6a6,#ffbe4d,#ff5a6e)}
  .legend .ramp-l{display:flex;justify-content:space-between;width:120px;font-family:var(--mono)}
  .maplist{position:absolute;left:11px;top:11px;z-index:3;background:rgba(6,10,16,.85);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:11px;width:196px;backdrop-filter:blur(4px)}
  .maplist .mlh{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--dim);margin-bottom:6px}
  .mlrow{display:flex;align-items:center;gap:7px;padding:2px 0;color:var(--dim)}
  .mlrow b{font-family:var(--mono);color:var(--cyan);width:14px;text-align:center}
  .mlrow i{margin-left:auto;width:12px;height:12px;border-radius:3px;box-shadow:0 0 6px currentColor}

  .loc{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(84,150,180,.12)}
  .loc:last-child{border:0}
  .loc .p{font-family:var(--mono);font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(53,224,230,.4)}
  .loc small{color:var(--faint)}
  .abstain{font-size:11.5px;color:var(--amber);background:rgba(255,190,77,.08);border:1px solid rgba(255,190,77,.28);border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.45}
  .ok{font-size:11.5px;color:var(--green);margin-top:8px}

  .chan{display:flex;align-items:center;gap:8px;margin:6px 0}
  .chan .nm{width:110px;color:var(--dim);font-size:12px}
  .chan .track{flex:1;height:7px;background:rgba(20,29,41,.9);border-radius:5px;overflow:hidden}
  .chan .track>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 10px rgba(53,224,230,.5);transition:width .3s ease}
  .chan .pc{width:38px;text-align:right;font-family:var(--mono);font-size:12px}

  details{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(6px)}
  summary{cursor:pointer;padding:13px 15px;font-family:var(--mono);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
  summary:hover{color:var(--cyan)}
  details .inner{padding:0 15px 15px}
  .kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--dim)}
  .kv b{color:var(--ink);font-family:var(--mono)}
  .flash{color:var(--green);font-size:12px;margin-top:8px;font-family:var(--mono);text-shadow:0 0 10px rgba(55,230,166,.4)}
  .empty{color:var(--faint);padding:60px;text-align:center;font-family:var(--mono);letter-spacing:1px}
  @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}

  /* ---- real map (Leaflet) ---- */
  #lmap{position:absolute;inset:0;z-index:1;background:#070b12}
  .leaflet-container{background:#070b12!important;font-family:var(--mono)}
  .leaflet-tile{filter:brightness(1.02) contrast(1.18) saturate(.68) hue-rotate(-8deg)}  /* ctOS surveillance look */
  .leaflet-heatmap-layer{opacity:.5}   /* dim heat so the network lines stand out */
  .leaflet-control-zoom a{background:rgba(10,16,24,.92)!important;color:var(--cyan)!important;
    border-color:var(--line)!important;text-shadow:0 0 6px rgba(53,224,230,.5)}
  .leaflet-tooltip{background:rgba(6,10,16,.92);border:1px solid var(--line2);color:var(--ink);
    font-family:var(--mono);font-size:10px;box-shadow:0 0 10px rgba(0,0,0,.6)}
  .leaflet-tooltip-top:before{border-top-color:var(--line2)}
  .numpin{width:24px;height:24px;border-radius:50%;background:var(--cyan);color:#04181a;
    font:800 13px var(--mono);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 14px rgba(53,224,230,.9),0 0 0 2px #04181a;border:2px solid #fff}
  /* bold, labelled hotspot pin for the command-centre map */
  .hotpin{display:flex;align-items:center;transform:translate(-14px,-14px);pointer-events:auto}
  .hotpin .n{width:28px;height:28px;border-radius:50%;color:#0a0405;font:900 14px var(--mono);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 16px currentColor,0 0 0 3px rgba(4,10,16,.7)}
  .hotpin .lb{margin-left:7px;background:rgba(6,10,16,.92);color:#fff;font:800 10.5px var(--mono);letter-spacing:.5px;
    padding:4px 9px;border-radius:7px;white-space:nowrap;box-shadow:0 0 10px rgba(0,0,0,.7);border:1px solid var(--line2)}
  .ret{width:46px;height:46px;position:relative}
  .ret::before{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
    border:2px solid #fff;border-radius:50%;box-shadow:0 0 12px #fff}
  .ret span{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
    border:2px solid #fff;border-radius:50%;animation:retping 1.7s ease-out infinite}
  @keyframes retping{0%{width:14px;height:14px;opacity:.9}100%{width:46px;height:46px;opacity:0}}
  .mapfx{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      linear-gradient(rgba(53,224,230,.05) 1px,transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg,rgba(53,224,230,.05) 1px,transparent 1px) 0 0/44px 44px,
      radial-gradient(130% 130% at 50% 45%,transparent 56%,rgba(0,6,12,.66) 100%),

<script>
const API = location.protocol==='file:' ? 'http://127.0.0.1:8000' : '';
let HOT=null, PROJ=null, SEL=null, PLAY=null, REPLAY_T=0, LASTHL=null, SELMETA=null;
let CURDIST=null, FOCUSON=true, SOUND=true, TYPETOK=0, VOICES=[], JVOICE=null, CURAUDIO=null;
let MAP=null, HEATL=null, ATML=null, MKL=null, RETL=null, FLOWL=null, MESHL=null, RSVG=null;
let REPLAYING=false, FRAMED=false, ATMXY={}, ATMMETA={};
let QUEUE=[], URGENT_SEEN=new Set(), SUPPRESS_URGENT=false, POLL=null;  // urgent-popup state
let BASELINE_ACKS=null, ALERT_LAST=0;                                    // only alert on NEW reds, throttled
let OMAP=null, OHEAT=null, VIEW='overview';                              // command-centre overview state
let CINE_BEAT=-1, LAST_TRAIL_SIG=null;                                   // cinematic replay director state
let ALERTS_ON=(()=>{try{return localStorage.getItem('alertsOn')!=='0';}catch(e){return true;}})();
const $=id=>document.getElementById(id);
const money=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const moneyC=v=>v>=1e7?'₹'+(v/1e7).toFixed(2)+' Cr':v>=1e5?'₹'+(v/1e5).toFixed(1)+' L':money(v);  // compact ₹ for big tiles
const pct=v=>Math.round(v*100)+'%';
async function jget(u){return (await fetch(API+u)).json();}
async function jpost(u){return (await fetch(API+u,{method:'POST'})).json();}
function tierColor(t){return t==='RED'?'var(--red)':t==='AMBER'?'var(--amber)':'var(--faint)';}
function riskColor(t){t=Math.max(0,Math.min(1,t||0));
  const g=[55,230,166],y=[255,190,77],r=[255,90,110];let a,b,f;
  if(t<0.5){a=g;b=y;f=t/0.5;}else{a=y;b=r;f=(t-0.5)/0.5;}
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*f));return `rgb(${c[0]},${c[1]},${c[2]})`;}
function convexHull(pts){if(pts.length<3)return pts;
  pts=pts.slice().sort((p,q)=>p.x-q.x||p.y-q.y);
  const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lo=[];for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  const up=[];for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  lo.pop();up.pop();return lo.concat(up);}

// ---------- map projection (returns extents for scale) ----------
function buildProj(m){const la=m.map(x=>x.lat),lo=m.map(x=>x.lon);
  const mla=Math.min(...la),Mla=Math.max(...la),mlo=Math.min(...lo),Mlo=Math.max(...lo);
  const W=800,H=560,p=46;
  return {x:v=>p+(v-mlo)/(Mlo-mlo)*(W-2*p), y:v=>H-p-(v-mla)/(Mla-mla)*(H-2*p),
    mlo,Mlo,mla,Mla,W,H,p};}
async function loadHotspots(){HOT=await jget('/hotspots?min_amt=0');PROJ=buildProj(HOT.atm_markers);
  ATMXY={}; ATMMETA={}; HOT.atm_markers.forEach(m=>{ATMXY[m.atm_id]=[m.lat,m.lon];
    ATMMETA[m.atm_id]={district:m.district,pin:m.pin,operator:m.operator};});}
// human-readable coordinate string, e.g. "18.463°N, 73.875°E"
function coordStr(ll){ if(!ll||ll[0]==null)return ''; return ll[0].toFixed(3)+'°N, '+ll[1].toFixed(3)+'°E'; }
// nearest district name for a raw point (fallback when a node carries no district)
function nearestDistrict(ll){ if(!ll||!HOT||!HOT.district_centroids)return '';
  let best='',bd=1e9; for(const[d,c]of Object.entries(HOT.district_centroids)){
    const k=haversine(ll,[c.lat,c.lon]); if(k!=null&&k<bd){bd=k;best=d;}} return best; }
// full "accurate location" label for a trail node: area · PIN · coordinates
function nodePlace(n){ const parts=[];
  const dist=n.district||nearestDistrict([n.lat,n.lon]); if(dist)parts.push(dist);
  if(n.pin)parts.push('PIN '+n.pin);
  const cs=coordStr([n.lat,n.lon]); if(cs)parts.push(cs);
  return parts.join(' · '); }

// ---- approx distances (great-circle, straight-line) ----------------------
// All coordinates here are KYC centroids / predicted cells -- NOT a live GPS
// fix on any person (R3). "Distance" therefore means the honest straight-line
// gap between where accounts are *registered* and where the cash *surfaces*.
function haversine(a,b){ if(!a||!b||a[0]==null||b[0]==null)return null;
  const R=6371,toR=x=>x*Math.PI/180, dLa=toR(b[0]-a[0]), dLo=toR(b[1]-a[1]);
  const s=Math.sin(dLa/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s))); }
function kmText(km){ return km==null?'—':(km<1?Math.round(km*1000)+' m':km.toFixed(km<10?1:0)+' km'); }
// Resolve the case geography: SOURCE (victim), the cash-out AGENT's registered
// area, and the DESTINATION (actual cash-out ATM in the trail, else predicted).
function caseGeo(trail, loc){
  const g={victim:null, agent:null, dest:null, destLabel:'', destPlace:''};
  const atmPlace=id=>{const m=ATMMETA[id]||{},ll=ATMXY[id];
    return [m.district,m.pin?'PIN '+m.pin:'',coordStr(ll)].filter(Boolean).join(' · ');};
  if(trail&&trail.nodes){
    const v=trail.nodes.find(n=>n.is_victim); if(v&&v.lat)g.victim=[v.lat,v.lon];
    const a=trail.nodes.find(n=>n.is_leaf); if(a&&a.lat)g.agent=[a.lat,a.lon];
    const co=(trail.edges||[]).find(e=>e.atm_id&&ATMXY[e.atm_id]);
    if(co){g.dest=ATMXY[co.atm_id]; g.destLabel=co.atm_id; g.destPlace=atmPlace(co.atm_id);}
  }
  if(!g.dest&&loc){   // no observed cash-out yet -> use the PREDICTED location, honouring abstention (R5)
    if(loc.granularity==='terminal'&&loc.terminals&&loc.terminals[0]&&ATMXY[loc.terminals[0].atm_id]){
      const id=loc.terminals[0].atm_id;
      g.dest=ATMXY[id]; g.destLabel=id; g.destPlace=atmPlace(id); g.approx=false; }
    else if(loc.cells&&loc.cells[0]&&loc.cells[0].lat!=null){
      const c=loc.cells[0]; g.dest=[c.lat,c.lon]; g.destLabel=(c.district||'')+' ~5 km cell';
      g.destPlace=[c.district,coordStr([c.lat,c.lon])].filter(Boolean).join(' · '); g.approx=true; }
    else if(loc.districts&&loc.districts[0]&&loc.districts[0].lat!=null){
      const d=loc.districts[0]; g.dest=[d.lat,d.lon]; g.destLabel=(d.district||'')+' district';
      g.destPlace=[d.district,coordStr([d.lat,d.lon])].filter(Boolean).join(' · '); g.approx=true; }
  }
  return g;
}

// ---- money-flow drawn ON the real map (victim -> mules -> cash-out ATMs) ----
function drawFlow(trail, loc){
  if(!MAP||!trail)return;
  if(!FLOWL)FLOWL=L.layerGroup().addTo(MAP); else FLOWL.clearLayers();
  const pos={}; (trail.nodes||[]).forEach(n=>{ if(n.lat&&n.lon)pos[n.account_id]=[n.lat,n.lon]; });
  // edges first (so nodes sit on top). Distances live on hover (sticky) -- clean map.
  (trail.edges||[]).forEach(e=>{
    const a=pos[e.src_account];
    if(e.atm_id){ const atm=ATMXY[e.atm_id];              // cash-out: line to the ATM + a burst
      if(a&&atm){ const m=ATMMETA[e.atm_id]||{}, km=kmText(haversine(a,atm));
        const atmLbl='CASH-OUT · '+e.atm_id+(m.district?'<br>'+m.district+(m.pin?' · PIN '+m.pin:''):'')+'<br>'+coordStr(atm)+' · ~'+km+' hop'+(m.operator?'<br>'+m.operator:'');
        L.polyline([a,atm],{renderer:RSVG,className:'flowline',color:'#ff5a6e',weight:2.4,opacity:.95,dashArray:'6 5'})
          .bindTooltip('cash-out · ~'+km,{sticky:true,className:'distlbl out'}).addTo(FLOWL);
        L.circleMarker(atm,{renderer:RSVG,radius:10,color:'#fff',weight:2,fillColor:'#ff2d45',fillOpacity:.85})
          .bindTooltip('CASH-OUT',{permanent:true,direction:'top',className:'namelbl c',offset:[0,-5]})
          .bindPopup(atmLbl).addTo(FLOWL); } }
    else { const b=pos[e.dst_account];                    // transfer between accounts
      if(a&&b)L.polyline([a,b],{renderer:RSVG,className:'flowline',color:'#4fe3e8',weight:2.2,opacity:.9,dashArray:'6 5'})
          .bindTooltip('~'+kmText(haversine(a,b))+' hop',{sticky:true,className:'distlbl hop'}).addTo(FLOWL); }
  });
  // SOURCE -> DESTINATION guide + a single minimal TARGET tag (full detail on hover)
  const g=caseGeo(trail, loc);
  if(g.victim&&g.dest){ const tot=kmText(haversine(g.victim,g.dest));
    L.polyline([g.victim,g.dest],{renderer:RSVG,className:'guideline',color:'#ffbe4d',weight:1.4,opacity:.45,dashArray:'2 8',interactive:false}).addTo(FLOWL);
    const dfull=(g.approx?'PREDICTED TARGET (approx)':'TARGET')+' · '+(g.destPlace||g.destLabel||'')+'<br>~'+tot+' straight-line from source';
    L.marker(g.dest,{zIndexOffset:900,
      icon:L.divIcon({className:'',html:'<div class="destpin">◈ TARGET · ~'+tot+'</div>',iconSize:[0,0]})})
      .bindTooltip(dfull,{direction:'top'}).addTo(FLOWL); }
  // nodes -- each keeps a visible NAME tag; click a node for its full KYC location
  (trail.nodes||[]).forEach(n=>{ const p=pos[n.account_id]; if(!p)return;
    const col=n.is_victim?'#4aa3ff':n.is_leaf?'#ff5a6e':'#ffbe4d';
    const nm=n.is_victim?'VICTIM':n.is_leaf?'AGENT':'MULE';
    const cls=n.is_victim?'v':n.is_leaf?'a':'m';
    const role=n.is_victim?'SOURCE · VICTIM':n.is_leaf?'CASH-OUT AGENT · holds funds':'MULE';
    const place=nodePlace(n);
    L.circleMarker(p,{renderer:RSVG,radius:n.is_victim?10:n.is_leaf?9:8,color:'#fff',weight:2,fillColor:col,fillOpacity:.98,
      className:n.is_leaf?'flowpulse':''})
      .bindTooltip(nm,{permanent:true,direction:'top',className:'namelbl '+cls,offset:[0,-7]})
      .bindPopup(role+' · '+n.account_id+(place?'<br>'+place:'')).addTo(FLOWL); });
}
// frame the whole case (victim + mules + predicted cell + cash-out ATMs) once, at replay start
function frameCase(trail, loc){
  if(!MAP||!trail)return;
  const pts=[]; (trail.nodes||[]).forEach(n=>{if(n.lat&&n.lon)pts.push([n.lat,n.lon]);});
  (trail.edges||[]).forEach(e=>{if(e.atm_id&&ATMXY[e.atm_id])pts.push(ATMXY[e.atm_id]);});
  if(loc&&loc.cells)loc.cells.slice(0,3).forEach(c=>pts.push([c.lat,c.lon]));
  if(pts.length){try{MAP.flyToBounds(L.latLngBounds(pts).pad(0.25),{duration:1.0});
    setTimeout(()=>{try{MAP.fitBounds(L.latLngBounds(pts).pad(0.25))}catch(e){}},1200);}catch(e){}}
}
// ---- CINEMATIC replay director (Nolan mode) ----
function cinemaOn(){const m=$('maphold');return m&&m.classList.contains('cinema');}
function enterCinema(){const m=$('maphold');if(m){m.classList.add('cinema');m.classList.remove('climax');}CINE_BEAT=-1;}
function exitCinema(){const m=$('maphold');if(m){m.classList.remove('cinema');m.classList.remove('climax');}CINE_BEAT=-1;}
function casePts(p){const pts=[],tr=p._trail;
  (tr&&tr.nodes||[]).forEach(n=>{if(n.lat&&n.lon)pts.push([n.lat,n.lon]);});
  (tr&&tr.edges||[]).forEach(e=>{if(e.atm_id&&ATMXY[e.atm_id])pts.push(ATMXY[e.atm_id]);});

  const acts=['ESTABLISHING SCENE','TRACING THE MONEY','LOCKING ON TARGET','⚠ CASH-OUT WINDOW — FREEZE'];

function trailSVG(tr){if(!tr||!tr.nodes.length)return '<div class="cap">no trail</div>';

  const hops=Object.keys(byh).map(Number).sort((a,b)=>a-b),W=330,colW=W/(hops.length+.5),pos={};let s='';
  hops.forEach((h,hi)=>byh[h].forEach((n,ni)=>{const x=26+hi*colW,y=22+ni*24;pos[n.account_id]={x,y};

// big interactive money-mule NETWORK graph (victim -> mules -> cash-out)
function muleGraphSVG(tr){
  if(!tr||!tr.nodes||!tr.nodes.length)return '<div class="cap">building network&hellip;</div>';
  const W=820,H=300,padX=64,padY=30;
  const byh={}; tr.nodes.forEach(n=>(byh[n.hop_from_victim]=byh[n.hop_from_victim]||[]).push(n));
  const hops=Object.keys(byh).map(Number).sort((a,b)=>a-b);
  const cashouts=(tr.edges||[]).filter(e=>e.atm_id);
  const nCols=hops.length+(cashouts.length?1:0);
  const span=(W-2*padX)/Math.max(1,nCols-1);
  const colX=h=>padX+hops.indexOf(h)*span;
  const cashX=padX+(nCols-1)*span;
  const maxT=Math.max(1,...tr.nodes.map(n=>n.tainted_amount||0));
  const rOf=t=>7+13*Math.sqrt((t||0)/maxT);
  const pos={};
  hops.forEach(h=>{const col=byh[h];col.forEach((n,i)=>{
    const gap=Math.min(66,(H-2*padY)/Math.max(1,col.length));
    pos[n.account_id]={x:colX(h),y:H/2+(i-(col.length-1)/2)*gap,r:rOf(n.tainted_amount),n};});});
  let edges='',cash='';
  (tr.edges||[]).forEach((e,idx)=>{
    const a=pos[e.src_account]; if(!a)return;
    let bx,by,co=false;
    if(e.atm_id){ bx=cashX; by=H/2+(((idx%5)-2)*42); co=true; pos['__a'+idx]={x:bx,y:by,atm:e.atm_id,cash:true}; }
    else { const b=pos[e.dst_account]; if(!b)return; bx=b.x; by=b.y; }
    const mx=(a.x+bx)/2, col=co?'#ff5a6e':'#4fe3e8', w=1.3+3.2*Math.sqrt((e.tainted_amount||0)/maxT);
    edges+=`<path class="mgedge" d="M${a.x},${a.y} C${mx},${a.y} ${mx},${by} ${bx},${by}" fill="none" stroke="${col}" stroke-width="${w.toFixed(1)}" stroke-opacity=".5" stroke-dasharray="7 6"><title>${money(e.tainted_amount)} &middot; ${e.channel}${co?' &middot; CASH-OUT '+e.atm_id:''}</title></path>`;
  });
  Object.keys(pos).filter(k=>pos[k].cash).forEach(k=>{const p=pos[k];
    cash+=`<g class="mgnode leaf"><rect x="${p.x-7}" y="${p.y-7}" width="14" height="14" transform="rotate(45 ${p.x} ${p.y})" fill="#ff2d45" stroke="#fff" stroke-width="1.3" style="filter:drop-shadow(0 0 7px #ff2d45)"><title>CASH-OUT ${p.atm}</title></rect>
      <text x="${p.x}" y="${p.y+24}" text-anchor="middle" font-size="9" fill="#ff9aa6" font-family="ui-monospace,monospace">CASH-OUT</text></g>`;});
  let nodes='';
  tr.nodes.forEach(n=>{const p=pos[n.account_id];if(!p)return;
    const col=n.is_victim?'#4aa3ff':n.is_leaf?'#ff5a6e':'#ffbe4d';
    const nm=n.is_victim?'VICTIM':n.is_leaf?'MULE ✦':'MULE';
    const role=n.is_victim?'VICTIM (source)':n.is_leaf?'MULE · holding cash NOW':'MULE (pass-through)';
    nodes+=`<g class="mgnode ${n.is_leaf?'leaf':''}" style="color:${col}">
      <circle cx="${p.x}" cy="${p.y}" r="${p.r.toFixed(1)}" fill="${col}" fill-opacity=".92" stroke="#fff" stroke-width="1.4" style="filter:drop-shadow(0 0 6px ${col})">
        <title>${role} · ${n.account_id} · ${money(n.tainted_amount)} held · hop ${n.hop_from_victim}${n.district?' · '+n.district:''}${n.pin?' · PIN '+n.pin:''}</title></circle>
      <text x="${p.x}" y="${(p.y+p.r+13).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#dfeaf3" font-family="ui-monospace,monospace">${nm}</text>
      <text x="${p.x}" y="${(p.y+p.r+24).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#8598ab" font-family="ui-monospace,monospace">${money(n.tainted_amount)}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:302px">${edges}${cash}${nodes}</svg>
    <div class="mglegend">
      <span><i style="background:#4aa3ff;color:#4aa3ff"></i>victim</span>
      <span><i style="background:#ffbe4d;color:#ffbe4d"></i>mule (pass-through)</span>
      <span><i style="background:#ff5a6e;color:#ff5a6e"></i>holding cash now &mdash; freeze target</span>
      <span><i class="dia" style="background:#ff2d45;color:#ff2d45"></i>cash-out point</span>
      <span>circle size = money held</span>
    </div>`;
}

// ---------- derived text ----------
function channelTop(ch){return [['ATM',ch.ATM],['POS (card cash)',ch.POS],['keeps moving',ch.onward_transfer],['sits idle',ch.dormant]].sort((a,b)=>b[1]-a[1]);}
function whereText(loc){
  if(loc.granularity==='terminal'&&loc.terminals[0])return {v:loc.terminals[0].atm_id,s:'exact ATM'};
  if(loc.granularity==='cell'&&loc.cells[0])return {v:loc.cells[0].district,s:'~5 km area'};
  return {v:(loc.districts[0]||{}).district||'?',s:'district only'};}
function whenText(c){const w=c.window_minutes;return w[0]===0?`0–${w[1]} min`:`${w[0]}–${w[1]} min`;}
function locListHTML(loc){
  if(loc.granularity==='terminal')
    return loc.terminals.map((t,i)=>`<div class="loc"><span>${i+1}. <span class="mono">${t.atm_id}</span> <small>[${t.sources.join(',')}]</small></span><span class="p">${pct(t.p)}</span></div>`).join('');
  if(loc.granularity==='cell')
    return loc.cells.slice(0,4).map((t,i)=>`<div class="loc"><span>${i+1}. ${t.district} <small>${t.n_terminals} ATMs</small></span><span class="p">${pct(t.p)}</span></div>`).join('');
  return loc.districts.map((t,i)=>`<div class="loc"><span>${i+1}. ${t.district}</span><span class="p">${pct(t.p)}</span></div>`).join('');}
function abstainHTML(loc){return loc.abstained_at
  ? `<div class="abstain"><b>Not naming one ATM.</b> ${loc.abstain_reason}</div>`
  : `<div class="ok">&#10003; Confident enough to name a specific ATM.</div>`;}
function chanRowsHTML(chans){return chans.map(x=>`<div class="chan"><span class="nm">${x[0]}</span><span class="track"><i style="width:${x[1]*100}%"></i></span><span class="pc">${pct(x[1])}</span></div>`).join('');}

// ---------- JARVIS briefing ----------
function districtOf(loc){return (loc.cells&&loc.cells[0]&&loc.cells[0].district)||(loc.districts&&loc.districts[0]&&loc.districts[0].district)||'the area';}
function buildBrief(p){
  const c=p.cashout,loc=p.location,r=p.recommendation,ch=p.channel;
  const chans=channelTop(ch),top=chans[0][0],dist=districtOf(loc),where=whereText(loc);
  const acct=p.account_id, amt=money(r.tainted_amount), p10=Math.round(c.p_10m*100);
  const howWord = top==='ATM'?'an ATM withdrawal':top==='POS (card cash)'?'a POS card-cash out':
    top==='keeps moving'?'another onward transfer':'sitting idle';
  // narrative
  let n=`Complaint ${p.ack_no.slice(0,6)}. ${amt} has been traced to account ${acct}, which is holding the stolen funds right now. `;
  if(top==='keeps moving'){
    n+=`The money is still moving — most likely ${howWord} in the next ${c.window_minutes[1]} minutes, so do not deploy anyone yet. `;
  } else if(top==='sits idle'){
    n+=`It is currently sitting still, giving you a window to act. `;
  } else {
    n+=`There is a ${p10}% chance of a cash-out within 10 minutes, most likely via ${howWord} in ${where.v} (${where.s}). `;
  }
  n+= loc.abstained_at ? `I can pin this to the ${loc.granularity} level, but the distribution is too flat to name a single ATM. `
                       : ``;
  n+=`My recommendation is to ${r.action}.`;
  // steps
  const steps=[], red=r.tier==='RED';
  if(top==='ATM'||top==='POS (card cash)'){
    if(red){
      steps.push(`Freeze account ${acct} immediately — this is the fastest way to stop the loss.`);
      steps.push(`Alert ${r.target_station||dist+' cyber PS'} covering the ${dist} cell.`);
      steps.push(`If the freeze cannot land in time, deploy to the highlighted ~5 km cell and pull ATM CCTV / footfall.`);
    } else {
      steps.push(`Place a watch / lien on account ${acct}.`);
      steps.push(`Brief the ${dist} desk and pre-draft the freeze request.`);
      steps.push(`Re-check in 10–20 minutes as the hazard rises.`);
    }
  } else if(top==='keeps moving'){
    steps.push(`Hold — do not deploy; the money is still being layered.`);
    steps.push(`Trace the next hop and identify the beneficiary account and bank.`);
    steps.push(`Send a freeze notice to the receiving bank's nodal officer / PSP.`);
  } else {
    steps.push(`Freeze account ${acct} now, while the funds are still sitting in it.`);
    steps.push(`Keep tracing the chain for any late movement.`);
  }
  return {narr:n, steps, red};
}
function stepsHTML(b){return b.steps.map((s,i)=>`<div class="jstep ${b.red&&i===0?'red':''}"><b>${i+1}</b><span>${s}</span></div>`).join('');}
// the "why" -- concrete evidence behind the call, so the answer is explainable
function evidenceHTML(p, trail){
  const c=p.cashout, loc=p.location, ch=p.channel, chans=channelTop(ch), b=[];
  if(trail && trail.nodes){
    const node=trail.nodes.find(n=>n.account_id===p.account_id);
    if(node){ const h=node.hop_from_victim;
      b.push(`Traced <b>${h} hop${h===1?'':'s'}</b> from the victim to <b>${p.account_id}</b>, now holding <b>${money(node.tainted_amount)}</b>.`);
      b.push(node.is_leaf ? `The money is <b>still sitting here</b> — a window to freeze before it clears.`
                          : `The money is <b>being forwarded onward</b> — trace the next hop.`);
    }
  }
  b.push(`Cash-out risk reaches <b>${pct(c.p_10m)}</b> in 10 min and ${c.p_60m>c.p_10m+0.02?'<b>keeps climbing</b>':'levels off'} over the hour.`);
  b.push(`Most likely next move: <b>${chans[0][0]}</b> (${pct(chans[0][1])}).`);
  const srcs=new Set();(loc.terminals||[]).forEach(t=>(t.sources||[]).forEach(s=>srcs.add(s)));
  const why=[];
  if(srcs.has('C1'))why.push("this account's own past withdrawals");
  if(srcs.has('C4'))why.push("its ring's shared cash-out spots");
  if(srcs.has('C3'))why.push('its KYC home area');
  if(srcs.has('C5'))why.push('known fraud ATMs nearby');
  if(why.length)b.push(`Location narrowed from ${why.join(', ')}.`);
  else if(loc.abstained_at)b.push(`Too little history to pin one ATM — held to the ${loc.granularity} level.`);
  const g=caseGeo(trail, loc);
  if(g.victim&&g.dest){ const tot=haversine(g.victim,g.dest), place=g.destPlace||g.destLabel;
    b.push(`Cash surfaces <b>~${kmText(tot)}</b> (straight-line) from the victim's registered area${place?', at <b>'+place+'</b>':''}.`);
    if(g.agent){ const ad=haversine(g.agent,g.dest);
      if(ad!=null)b.push(`The holding account is registered <b>~${kmText(ad)}</b> from that cash-out point.`); } }
  return b.map(x=>`<div class="jstep ev"><b>&rsaquo;</b><span>${x}</span></div>`).join('');
}
function typeInto(el, text){if(!el)return;const tok=++TYPETOK;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=text;return;}
  el.innerHTML='';let i=0;(function step(){if(tok!==TYPETOK)return;
    el.innerHTML=text.slice(0,i)+'<span class="cur">▌</span>';i++;
    if(i<=text.length)setTimeout(step, 11);else el.textContent=text;})();}
// normalise text so the voice reads it ACCURATELY (₹, %, IDs, distances)
function toSpeech(t){return t
  .replace(/Complaint\s+(\d+)/g,(m,d)=>'Complaint '+d.split('').join(' '))
  .replace(/₹\s?([\d,]+)/g,(m,n)=>n.replace(/,/g,'')+' rupees')
  .replace(/ACC[_\- ]?(\d+)/g,(m,d)=>'account '+d.split('').join(' '))
  .replace(/~\s?(\d+(?:\.\d+)?)\s?km/gi,'about $1 kilometres')
  .replace(/%/g,' percent').replace(/&/g,' and ')
  .replace(/\s+/g,' ').trim();}
function pickDefaultVoice(){  // prefer a sweet English (ideally Indian-English) female voice
  const prefs=[/Neerja/i,/Heera/i,/Swara/i,/Aria/i,/Jenny/i,/Google UK English Female/i,/Samantha/i,/Zira/i,/Hazel/i,/Susan/i,/female/i];
  for(const rx of prefs){const v=VOICES.find(x=>rx.test((x.name||'')+' '+(x.lang||'')));if(v)return v;}
  return VOICES.find(x=>/en-IN/i.test(x.lang||''))||VOICES.find(x=>/^en/i.test(x.lang||''))||VOICES[0];}
function voiceOpts(){const en=VOICES.filter(v=>/^en/i.test(v.lang||''));const list=en.length?en:VOICES;
  return list.map(v=>`<option value="${v.name}" ${v.name===JVOICE?'selected':''}>${v.name.replace(/Microsoft |Google /,'')}</option>`).join('')||'<option>default</option>';}
function populateVoices(){if(!window.speechSynthesis)return;const load=()=>{VOICES=speechSynthesis.getVoices()||[];
  if(!JVOICE){const d=pickDefaultVoice();JVOICE=d&&d.name;}const s=$('voiceSel');if(s)s.innerHTML=voiceOpts();};
  load();speechSynthesis.onvoiceschanged=load;}
function setVoice(name){JVOICE=name;speak('Voice set. This is your cash-out forecast assistant.');}
function speak(text){try{if(!SOUND||!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(toSpeech(text));u.rate=0.88;u.pitch=1.06;u.volume=1;  // slow, soothing, smooth
  const v=VOICES.find(x=>x.name===JVOICE)||pickDefaultVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);}catch(e){}}
// play a bundled cloned-voice clip if present (voice/<ack>.mp3 -> voice/default.mp3),
// otherwise fall back to the system voice. Never fails on stage.
function playAudioChain(urls, fallback){
  if(!urls.length)return fallback();
  const a=new Audio(urls[0]);CURAUDIO=a;
  a.onerror=()=>playAudioChain(urls.slice(1),fallback);
  a.play().catch(()=>playAudioChain(urls.slice(1),fallback));}
function playBrief(ack,text){if(!SOUND)return;
  try{if(CURAUDIO){CURAUDIO.pause();CURAUDIO=null;}
    playAudioChain(['voice/'+ack+'.mp3','voice/default.mp3'],()=>speak(text));}catch(e){speak(text);}}
function stopVoice(){try{if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.cancel();}}catch(e){}
  if(CURAUDIO){try{CURAUDIO.pause();CURAUDIO.currentTime=0;}catch(e){}CURAUDIO=null;}}
function toggleSound(){SOUND=!SOUND;const b=$('sndBtn');if(b)b.textContent=SOUND?'🔊':'🔇';
  if(!SOUND)stopVoice();}

// ---------- briefing: in-place update (no flicker) ----------
function updateBriefing(p, clk){
  if(!$('kWill')) return renderBriefing(p, clk);

  const where=whereText(loc), chans=channelTop(ch), tc=tierColor(r.tier);

  set('kWillSub', `chance in the next 10 min · ${c.severity}`);
  set('kWhen', whenText(c)); set('kHow', chans[0][0]);
  set('kHowSub', `${pct(chans[0][1])} · then ${chans[1][0]}`);

  if($('hazBox')) $('hazBox').innerHTML=hazardSVG(c);
  if($('locBox')) $('locBox').innerHTML=locListHTML(loc)+abstainHTML(loc);
  if($('chanBox')) $('chanBox').innerHTML=chanRowsHTML(chans);
  set('kvTarget', p.account_id); set('kvTaint', money(r.tainted_amount)); set('kvStation', r.target_station||'--');
  if(p._trail && $('trailBox')) $('trailBox').innerHTML=trailSVG(p._trail);
  if(p._trail && $('muleBox')) $('muleBox').innerHTML=muleGraphSVG(p._trail);
  if($('jwhy')) $('jwhy').innerHTML=evidenceHTML(p, p._trail);
  if($('jsteps')) $('jsteps').innerHTML=stepsHTML(buildBrief(p));   // actions update live
  CURDIST=districtOf(loc);
  updateNarr(p);                                                    // live narration + action badge
  const ctc=$('cineTC'); if(ctc&&clk) ctc.textContent='T '+clk;     // cinematic timecode (money's real clock)
  const hl=(loc.cells&&loc.cells[0]?loc.cells[0].cell:null);
  try{
    if(MAP){
      if(!FRAMED){ drawMesh(loc); FRAMED=true; if(!cinemaOn()) frameCase(p._trail, loc); }
      const sig=p._trail?(p._trail.nodes.length+'/'+p._trail.edges.length):'';
      if(sig!==LAST_TRAIL_SIG){ drawFlow(p._trail, loc); LAST_TRAIL_SIG=sig; }  // only redraw when the trail grows (keeps the comet animation smooth)
      if(cinemaOn()) cineDirect(REPLAY_T, p);                        // Nolan camera
      if(hl!==LASTHL){ lockReticleOnly(hl); LASTHL=hl; } }
    else { if(hl!==LASTHL){ renderMapSVG(hl, FOCUSON?CURDIST:null); LASTHL=hl; } }
  }catch(e){}
}

async function selectCase(ack){
  VIEW='case'; if(OMAP){try{OMAP.remove();}catch(e){}OMAP=null;OHEAT=null;}   // leave the overview
  SEL=ack;REPLAY_T=0;loadQueue(); setNav();
  const q=await jget(`/queue?limit=60`);SELMETA=q.find(x=>x.ack_no===ack);
  const p=await jget(`/predict/${ack}`);renderBriefing(p, null, true);
  // (no auto-popup on click -- opening a case just shows it; urgent alerts are opt-in)
}

async function dispatch(ack,acc){const r=await jpost(`/alerts/dispatch?ack_no=${ack}&account=${acc}`);
  const f=$('flash');if(!f)return;
  f.textContent=r.deduped?'Deduplicated (alert for this account fired < 15 min ago).'
    :(r.dispatched&&r.dispatched.length)?'Sent: '+r.dispatched.map(a=>a.channel+' → '+a.recipient).join(', ')
    :'No alert (tier '+r.recommendation.tier+', below dispatch threshold).';}
async function loadAlerts(){const a=await jget('/alerts');
  $('stage').innerHTML=`<div class="card"><h3>Alert delivery log (${a.length})</h3>`+
    (a.length?a.map(x=>`<div class="loc"><span><span class="tier ${x.tier}" style="padding:2px 7px">${x.tier}</span>
      <span class="mono">${x.channel}</span> <small>→ ${x.recipient}</small><br><small>${x.subject}</small></span>
      <span class="p" style="color:var(--green)">${x.status}</span></div>`).join(''):'<div class="cap">No alerts yet.</div>')+
    `</div><br><button class="btn ghost" onclick="SEL&&selectCase(SEL)">&larr; back to case</button>`;}

// ---------- replay ----------
function togglePlay(){const b=$('playbtn');
  if(PLAY){clearInterval(PLAY);PLAY=null;if(b)b.innerHTML='&#9654; Replay simulation';REPLAYING=false;exitCinema();return;}  // pause -> lift cinema
  if(!SEL)return;if(b)b.innerHTML='&#10073;&#10073; Pause';
  REPLAYING=true; FRAMED=false; REPLAY_T=0; CINE_BEAT=-1; LAST_TRAIL_SIG=null;
  enterCinema(); scrubTo(0);                    // roll film + show the establishing frame at once
  PLAY=setInterval(()=>{REPLAY_T+=3; if(REPLAY_T>120){ endReplay(); return; }
    const sc=$('scrub');if(sc)sc.value=REPLAY_T; scrubTo(REPLAY_T);},480);}
async function scrubTo(t){REPLAY_T=+t;if(!SEL)return;
  REPLAYING=true;
  const st=await jget(`/replay/state?case=${SEL}&t=${t}`);
  const p=st.prediction;p._trail=st.trail;
  updateBriefing(p, st.as_of.slice(11,19));}

// ---------- init ----------
(async function(){
  // restore saved UI prefs (sidebar state + alert toggle)
  try{ if(localStorage.getItem('railMin')==='1'){ document.querySelector('.app').classList.add('railmin');
    const ro=$('railOpen'); if(ro)ro.style.display='block'; } }catch(e){}
  const b=$('alertToggle'); if(b){b.className='atgl'+(ALERTS_ON?'':' off');
    b.innerHTML=(ALERTS_ON?'&#128276; alerts on':'&#128277; alerts off');}
  populateVoices();await loadQueue();await loadHotspots();
  showOverview();                        // land on the command centre, not a single case
  // no pop-up on load. Only genuinely NEW red cases (via the poll) alert, throttled.
  POLL=setInterval(async()=>{await loadQueue();if(VIEW==='overview')renderOverview();checkNewUrgent();}, 30000);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')dismissUrgent();});})();
</script>
