<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash-out Forecast Console -- SIH26184</title>
<style>
  :root{
    --bg:#070a0f; --panel:#0e141d; --panel2:#121a25; --line:#1d2735;
    --ink:#e9eff6; --dim:#808ea3; --faint:#586377;
    --red:#ff5d6c; --amber:#ffb84d; --green:#38dd9a; --cyan:#33d3d9; --accent:#33d3d9;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
     radial-gradient(1200px 400px at 80% -10%,rgba(51,211,217,.08),transparent 60%),var(--bg);
    color:var(--ink);font:13.5px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:var(--mono)}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}

  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0b1119,#080b11)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.4px}
  .brand .dotlogo{width:10px;height:10px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px var(--cyan)}
  .brand small{color:var(--faint);font-weight:400;letter-spacing:0}
  .chips{margin-left:auto;display:flex;gap:16px;align-items:center;font-family:var(--mono);font-size:12px}
  .chip{display:flex;align-items:center;gap:6px;color:var(--dim)}
  .chip b{color:var(--ink)}
  .sw{width:9px;height:9px;border-radius:50%}
  .sw.RED{background:var(--red)} .sw.AMBER{background:var(--amber)} .sw.GREY{background:var(--faint)}

  .app{display:grid;grid-template-columns:288px 1fr;height:calc(100vh - 53px)}

  /* ---- left: cases ---- */
  .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0a0f16}
  .rail .head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
  .rail select{background:#0c131c;color:var(--ink);border:1px solid var(--line);border-radius:7px;
    padding:4px 6px;font-size:11px;font-family:var(--mono)}
  .cases{overflow:auto;padding:6px 10px 14px;min-height:0}
  .case{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;
    padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
    cursor:pointer;background:#0c131c;transition:.12s}
  .case:hover{border-color:var(--cyan);transform:translateY(-1px)}
  .case.sel{border-color:var(--cyan);background:#0e1a24;box-shadow:0 0 0 1px rgba(51,211,217,.25) inset}
  .case .bar{width:8px;height:38px;border-radius:5px}
  .case .cid{font-family:var(--mono);font-weight:650;font-size:13px}
  .case .ftype{color:var(--faint);font-size:11px;font-family:var(--mono)}
  .case .cmeta{color:var(--dim);font-size:11.5px;margin-top:2px}
  .case .risk{font-family:var(--mono);font-weight:700;font-size:15px;text-align:right}
  .case .risk small{display:block;font-size:9px;color:var(--faint);font-weight:400;letter-spacing:.5px}

  /* ---- main stage ---- */
  .stage{overflow:auto;min-height:0;padding:16px 18px 26px}
  .stagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .stagehead .cid{font-family:var(--mono);font-size:17px;font-weight:700}
  .stagehead .ftype{color:var(--faint);font-family:var(--mono);font-size:12px}
  .tier{font-family:var(--mono);font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;letter-spacing:1px}
  .tier.RED{background:rgba(255,93,108,.16);color:var(--red);box-shadow:0 0 0 1px rgba(255,93,108,.35) inset}
  .tier.AMBER{background:rgba(255,184,77,.15);color:var(--amber);box-shadow:0 0 0 1px rgba(255,184,77,.35) inset}
  .tier.GREY{background:rgba(88,99,119,.18);color:#9aa7bb;box-shadow:0 0 0 1px rgba(88,99,119,.35) inset}

  /* replay control */
  .replay{margin-left:auto;display:flex;align-items:center;gap:10px}
  .replay .clock{font-family:var(--mono);font-size:15px;font-weight:700;min-width:86px;text-align:right}
  .replay input[type=range]{width:150px;accent-color:var(--cyan)}
  .btn{background:var(--cyan);color:#041316;border:0;border-radius:8px;padding:8px 13px;font-weight:750;
    cursor:pointer;font-size:12px;font-family:var(--mono);letter-spacing:.3px}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#101a24;color:var(--ink);border:1px solid var(--line)}

  /* action banner */
  .action{border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:16px}
  .action.RED{background:linear-gradient(90deg,rgba(255,93,108,.16),transparent);border:1px solid rgba(255,93,108,.4)}
  .action.AMBER{background:linear-gradient(90deg,rgba(255,184,77,.14),transparent);border:1px solid rgba(255,184,77,.4)}
  .action.GREY{background:linear-gradient(90deg,rgba(88,99,119,.14),transparent);border:1px solid var(--line)}
  .action .big{font-size:22px;font-weight:800;letter-spacing:.5px;font-family:var(--mono)}
  .action .why{color:var(--dim);font-size:12px;margin-top:3px}

  /* kpi tiles */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--cyan);opacity:.5}
  .kpi .v{font-family:var(--mono);font-size:26px;font-weight:750;line-height:1.1;margin-top:6px}
  .kpi .s{color:var(--dim);font-size:11.5px;margin-top:4px}

  .cols{display:grid;grid-template-columns:1fr 360px;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h3{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:1px;
    text-transform:uppercase;color:var(--dim);font-weight:600}
  .card .cap{color:var(--faint);font-size:11px;margin-bottom:8px}

  /* map */
  .maphold{position:relative;height:360px;border-radius:10px;overflow:hidden;background:#0a0f16}
  svg{width:100%;height:100%;display:block}
  .legend{position:absolute;right:10px;bottom:10px;background:rgba(8,11,17,.9);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;font-size:10px;color:var(--dim)}
  .legend .ramp{height:9px;width:120px;border-radius:5px;margin:3px 0;
    background:linear-gradient(90deg,#38dd9a,#ffb84d,#ff5d6c)}
  .legend .ramp-l{display:flex;justify-content:space-between;width:120px;font-family:var(--mono)}
  .maplist{position:absolute;left:10px;top:10px;background:rgba(8,11,17,.92);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;font-size:11px;width:190px}
  .maplist .mlh{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);margin-bottom:5px}
  .mlrow{display:flex;align-items:center;gap:7px;padding:2px 0;color:var(--dim)}
  .mlrow b{font-family:var(--mono);color:var(--ink);width:14px;text-align:center}
  .mlrow i{margin-left:auto;width:12px;height:12px;border-radius:3px}

  /* location list */
  .loc{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #172230}
  .loc:last-child{border:0}
  .loc .p{font-family:var(--mono);font-weight:700}
  .loc small{color:var(--faint)}
  .abstain{font-size:11.5px;color:var(--amber);background:rgba(255,184,77,.08);
    border:1px solid rgba(255,184,77,.25);border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.45}
  .ok{font-size:11.5px;color:var(--green);margin-top:8px}

  /* channel bars */
  .chan{display:flex;align-items:center;gap:8px;margin:5px 0}
  .chan .nm{width:110px;color:var(--dim);font-size:12px}
  .chan .track{flex:1;height:7px;background:#141d29;border-radius:5px;overflow:hidden}
  .chan .track>i{display:block;height:100%;background:var(--cyan)}
  .chan .pc{width:38px;text-align:right;font-family:var(--mono);font-size:12px}

  details{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  summary{cursor:pointer;padding:12px 14px;font-family:var(--mono);font-size:11px;letter-spacing:1px;
    text-transform:uppercase;color:var(--dim)}
  details .inner{padding:0 14px 14px}
  .kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--dim)}
  .kv b{color:var(--ink);font-family:var(--mono)}
  .flash{color:var(--green);font-size:12px;margin-top:8px;font-family:var(--mono)}
  .empty{color:var(--faint);padding:40px;text-align:center}
  @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dotlogo"></span> CASHOUT&nbsp;FORECAST
    <small>&nbsp;/ SIH26184 &middot; I4C-MHA</small></div>
  <div class="chips" id="chips"><span class="chip">loading&hellip;</span></div>
</header>

<div class="app">
  <!-- LEFT: cases -->
  <aside class="rail">
    <div class="head">
      <span class="lbl">Active cases</span>
      <select id="qsort" onchange="loadQueue()">
        <option value="imminence">most urgent</option>
        <option value="p">highest risk</option>
        <option value="amount">biggest amount</option>
        <option value="golden">least time left</option>
      </select>
    </div>
    <div class="cases" id="cases"></div>
  </aside>

  <!-- MAIN: briefing -->
  <main class="stage" id="stage">
    <div class="empty">Select a case on the left to see the forecast.</div>
  </main>
</div>

<script>
const API = location.protocol==='file:' ? 'http://127.0.0.1:8000' : '';
let HOT=null, PROJ=null, SEL=null, PLAY=null, REPLAY_T=0;
const $=id=>document.getElementById(id);
const money=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const pct=v=>Math.round(v*100)+'%';
async function jget(u){return (await fetch(API+u)).json();}
async function jpost(u){return (await fetch(API+u,{method:'POST'})).json();}

// ---------- colours ----------
function tierColor(t){return t==='RED'?'var(--red)':t==='AMBER'?'var(--amber)':'var(--faint)';}
function riskColor(t){t=Math.max(0,Math.min(1,t||0));
  const g=[56,221,154],y=[255,184,77],r=[255,93,108];let a,b,f;
  if(t<0.5){a=g;b=y;f=t/0.5;}else{a=y;b=r;f=(t-0.5)/0.5;}
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*f));return `rgb(${c[0]},${c[1]},${c[2]})`;}
function convexHull(pts){if(pts.length<3)return pts;
  pts=pts.slice().sort((p,q)=>p.x-q.x||p.y-q.y);
  const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lo=[];for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  const up=[];for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  lo.pop();up.pop();return lo.concat(up);}

// ---------- cases list ----------
async function loadQueue(){
  const items=await jget(`/queue?limit=60&sort=${$('qsort').value}`);
  const R=items.filter(i=>i.tier==='RED').length, A=items.filter(i=>i.tier==='AMBER').length;
  $('chips').innerHTML=`<span class="chip"><b>${items.length}</b> tracking</span>
    <span class="chip"><span class="sw RED"></span><b>${R}</b> freeze now</span>
    <span class="chip"><span class="sw AMBER"></span><b>${A}</b> watch</span>`;
  $('cases').innerHTML=items.map(i=>`
    <div class="case ${SEL===i.ack_no?'sel':''}" onclick="selectCase('${i.ack_no}')">
      <div class="bar" style="background:${tierColor(i.tier)}"></div>
      <div><div class="cid">#${i.ack_no.slice(0,6)} <span class="ftype">${i.fraud_category}</span></div>
        <div class="cmeta">${money(i.disputed_amount)} &middot; ${i.golden_hour_remaining_min}m left</div></div>
      <div class="risk" style="color:${tierColor(i.tier)}">${pct(i.p_cashout_10m)}<small>RISK</small></div>
    </div>`).join('');
}

// ---------- map ----------
function buildProj(m){const la=m.map(x=>x.lat),lo=m.map(x=>x.lon);
  const mla=Math.min(...la),Mla=Math.max(...la),mlo=Math.min(...lo),Mlo=Math.max(...lo);
  const W=800,H=560,p=46;
  return {x:v=>p+(v-mlo)/(Mlo-mlo)*(W-2*p), y:v=>H-p-(v-mla)/(Mla-mla)*(H-2*p)};}
async function loadHotspots(){HOT=await jget('/hotspots?min_amt=0');PROJ=buildProj(HOT.atm_markers);}
function renderMap(highlight){
  if(!HOT||!$('map'))return; const P=PROJ;
  const byd={};
  for(const m of HOT.atm_markers)(byd[m.district]=byd[m.district]||{atms:[],risk:0}).atms.push(m);
  for(const c of HOT.cells)(byd[c.district]=byd[c.district]||{atms:[],risk:0}).risk+=c.risk;
  const maxDR=Math.max(...Object.values(byd).map(d=>d.risk),1);
  const top=HOT.cells.slice(0,10);
  let reg='',atm='',mk='';
  for(const[d,info]of Object.entries(byd)){
    const pts=info.atms.map(m=>({x:P.x(m.lon),y:P.y(m.lat)}));if(pts.length<3)continue;
    let h=convexHull(pts);const cx=h.reduce((s,p)=>s+p.x,0)/h.length,cy=h.reduce((s,p)=>s+p.y,0)/h.length;
    h=h.map(p=>({x:cx+(p.x-cx)*1.16,y:cy+(p.y-cy)*1.16}));
    const t=info.risk/maxDR;
    reg+=`<polygon points="${h.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}"
      fill="${riskColor(t)}" fill-opacity="0.12" stroke="${riskColor(t)}" stroke-opacity="0.5"
      stroke-width="1.4" stroke-linejoin="round"/>
      <text x="${cx.toFixed(0)}" y="${(cy-3).toFixed(0)}" text-anchor="middle" fill="#e9eff6"
        font-size="14" font-weight="700">${d}</text>`;
  }
  for(const m of HOT.atm_markers)
    atm+=`<circle cx="${P.x(m.lon).toFixed(1)}" cy="${P.y(m.lat).toFixed(1)}" r="1" fill="#33415a" fill-opacity=".5"/>`;
  HOT.cells.forEach(c=>{const t=c.risk_norm||0,hot=(highlight&&c.cell===highlight),r=top.indexOf(c);
    mk+=`<circle cx="${P.x(c.lon).toFixed(1)}" cy="${P.y(c.lat).toFixed(1)}" r="${(5+16*t).toFixed(1)}"
      fill="${riskColor(t)}" fill-opacity="${hot?.95:.6}" stroke="${hot?'#fff':'#070a0f'}"
      stroke-width="${hot?2.5:.6}"><title>${c.district} risk ${c.risk}</title></circle>`;
    if(r>=0&&r<6)mk+=`<text x="${P.x(c.lon).toFixed(1)}" y="${(P.y(c.lat)+3).toFixed(1)}" text-anchor="middle"
      font-size="9" font-weight="800" fill="#06121a" pointer-events="none">${r+1}</text>`;});
  $('map').innerHTML=reg+atm+mk;
  $('legend').innerHTML=`<div style="color:#cdd6e2;font-family:var(--mono);font-size:10px;letter-spacing:1px">RISK</div>
    <div class="ramp"></div><div class="ramp-l"><span>low</span><span>high</span></div>`;
  $('maplist').innerHTML=`<div class="mlh">Top areas</div>`+top.slice(0,6).map((c,i)=>
    `<div class="mlrow"><b>${i+1}</b><span>${c.district}</span>
     <i style="background:${riskColor(c.risk_norm||0)}"></i></div>`).join('');
}

// ---------- charts ----------
function hazardSVG(c){const hs=c.hazard,W=330,H=120,pad=26;
  const xs=hs.map((h,i)=>pad+i*(W-2*pad)/(hs.length-1)), ys=hs.map(h=>H-pad-h.p_cumulative*(H-2*pad));
  const line=xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const area=`M${xs[0]},${H-pad} `+xs.map((x,i)=>`L${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ')+` L${xs.at(-1)},${H-pad}Z`;
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="#33d3d9"/>
    <text x="${x.toFixed(1)}" y="${H-9}" font-size="9" fill="#586377" text-anchor="middle">${hs[i].horizon_min}m</text>
    <text x="${x.toFixed(1)}" y="${(ys[i]-8).toFixed(1)}" font-size="9" fill="#cdd6e2" text-anchor="middle">${pct(hs[i].p_cumulative)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="height:126px">
    <path d="${area}" fill="rgba(51,211,217,.13)"/><path d="${line}" fill="none" stroke="#33d3d9" stroke-width="2"/>${dots}</svg>`;}
function trailSVG(tr){if(!tr||!tr.nodes.length)return '<div class="cap">no trail</div>';
  const byh={};tr.nodes.forEach(n=>(byh[n.hop_from_victim]=byh[n.hop_from_victim]||[]).push(n));
  const hops=Object.keys(byh).map(Number).sort((a,b)=>a-b),W=330,colW=W/(hops.length+.5),pos={};let s='';
  hops.forEach((h,hi)=>byh[h].forEach((n,ni)=>{const x=26+hi*colW,y=22+ni*24;pos[n.account_id]={x,y};
    const c=n.is_victim?'#33d3d9':n.is_leaf?'#ff5d6c':'#586377';
    s+=`<circle cx="${x}" cy="${y}" r="6" fill="${c}"><title>${n.account_id} ${money(n.tainted_amount)}</title></circle>`;}));
  let e='';tr.edges.forEach(x=>{const a=pos[x.src_account],b=x.dst_account?pos[x.dst_account]:null;
    if(a&&b)e+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#1d2735" stroke-width="${x.observed?1.4:.6}" stroke-dasharray="${x.observed?'':'3 2'}"/>`;
    if(a&&!b)e+=`<rect x="${a.x+8}" y="${a.y-4}" width="7" height="7" fill="#ff5d6c" transform="rotate(45 ${a.x+11} ${a.y})"/>`;});
  const rows=Math.max(...hops.map(h=>byh[h].length));
  return `<svg viewBox="0 0 ${W} ${24+rows*24}" style="height:${24+rows*24}px">${e}${s}</svg>`;}

// ---------- briefing ----------
function channelTop(ch){const o=[['ATM',ch.ATM],['POS (card cash)',ch.POS],
  ['keeps moving',ch.onward_transfer],['sits idle',ch.dormant]].sort((a,b)=>b[1]-a[1]);return o;}
function whereText(loc){
  if(loc.granularity==='terminal'&&loc.terminals[0])return {v:loc.terminals[0].atm_id,s:'exact ATM'};
  if(loc.granularity==='cell'&&loc.cells[0])return {v:loc.cells[0].district,s:'~5 km area'};
  return {v:(loc.districts[0]||{}).district||'?',s:'district only'};}
function whenText(c){const w=c.window_minutes;return w[0]===0?`0–${w[1]} min`:`${w[0]}–${w[1]} min`;}

function renderBriefing(p, clockHTML){
  const c=p.cashout, loc=p.location, r=p.recommendation, ch=p.channel;
  const where=whereText(loc), chans=channelTop(ch);
  const locList = loc.granularity==='terminal'
    ? loc.terminals.map((t,i)=>`<div class="loc"><span>${i+1}. <span class="mono">${t.atm_id}</span>
        <small>[${t.sources.join(',')}]</small></span><span class="p">${pct(t.p)}</span></div>`).join('')
    : loc.granularity==='cell'
    ? loc.cells.slice(0,4).map((t,i)=>`<div class="loc"><span>${i+1}. ${t.district}
        <small>${t.n_terminals} ATMs</small></span><span class="p">${pct(t.p)}</span></div>`).join('')
    : loc.districts.map((t,i)=>`<div class="loc"><span>${i+1}. ${t.district}</span><span class="p">${pct(t.p)}</span></div>`).join('');
  const abstain = loc.abstained_at
    ? `<div class="abstain"><b>Not naming one ATM.</b> ${loc.abstain_reason}</div>`
    : `<div class="ok">&#10003; Confident enough to name a specific ATM.</div>`;

  $('stage').innerHTML=`
    <div class="stagehead">
      <span class="cid">#${p.ack_no.slice(0,8)}</span>
      <span class="ftype">${(SELMETA&&SELMETA.fraud_category)||''}</span>
      <span class="tier ${r.tier}">${r.tier}</span>
      <div class="replay">
        <button class="btn" id="playbtn" onclick="togglePlay()">&#9654; Replay</button>
        <input type="range" id="scrub" min="0" max="120" step="1" value="${REPLAY_T}" oninput="scrubTo(this.value)">
        <span class="clock" id="clock">${clockHTML||'live'}</span>
      </div>
    </div>

    <div class="action ${r.tier}">
      <div><div class="big">${r.action}</div><div class="why">${r.reason}</div></div>
    </div>

    <div class="kpis">
      <div class="kpi"><span class="lbl">Will it cash out?</span>
        <div class="v" style="color:${tierColor(r.tier)}">${pct(c.p_10m)}</div>
        <div class="s">chance in the next 10 min &middot; ${c.severity}</div></div>
      <div class="kpi"><span class="lbl">When?</span>
        <div class="v">${whenText(c)}</div><div class="s">most likely window</div></div>
      <div class="kpi"><span class="lbl">How?</span>
        <div class="v" style="font-size:19px">${chans[0][0]}</div>
        <div class="s">${pct(chans[0][1])} &middot; then ${chans[1][0]}</div></div>
      <div class="kpi"><span class="lbl">Where?</span>
        <div class="v" style="font-size:19px">${where.v}</div><div class="s">${where.s}</div></div>
    </div>

    <div class="cols">
      <div class="card">
        <h3>Predicted cash-out area</h3>
        <div class="cap">Regions shaded by risk. Numbered dots = the most likely ~5 km areas. This case highlighted in white.</div>
        <div class="maphold"><svg id="map" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="maplist" id="maplist"></div><div class="legend" id="legend"></div></div>
      </div>
      <div>
        <div class="card" style="margin-bottom:14px">
          <h3>Chance of cash-out over the next hour</h3>${hazardSVG(c)}
        </div>
        <div class="card">
          <h3>Most likely locations</h3>${locList}${abstain}
        </div>
      </div>
    </div>

    <details>
      <summary>Technical details (money trail, channel odds, account)</summary>
      <div class="inner">
        <div class="cols">
          <div><h3 style="margin-top:6px">Money-flow trail</h3>
            <div class="cap">blue = victim &middot; red = holding cash (target) &middot; grey = pass-through &middot; dashed = unconfirmed</div>
            ${trailSVG(p._trail)}</div>
          <div><h3 style="margin-top:6px">How the money leaves (M2)</h3>
            ${chans.map(x=>`<div class="chan"><span class="nm">${x[0]}</span>
              <span class="track"><i style="width:${x[1]*100}%"></i></span><span class="pc">${pct(x[1])}</span></div>`).join('')}
            <h3 style="margin-top:12px">Account</h3>
            <div class="kv">target <b>${p.account_id}</b></div>
            <div class="kv">tainted held <b>${money(r.tainted_amount)}</b></div>
            <div class="kv">route alert to <b>${r.target_station||'--'}</b></div>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn" onclick="dispatch('${p.ack_no}','${p.account_id}')">Send freeze alert</button>
          <button class="btn ghost" onclick="loadAlerts()">Alert log</button>
        </div>
        <div class="flash" id="flash"></div>
      </div>
    </details>`;
  renderMap(loc.cells&&loc.cells[0]?loc.cells[0].cell:null);
  if(p._trail){/*trail already passed*/}
  else jget(`/trail/${p.ack_no}`).then(tr=>{const el=[...document.querySelectorAll('.inner .cols>div')][0];
    if(el)el.innerHTML=`<h3 style="margin-top:6px">Money-flow trail</h3>
      <div class="cap">blue = victim &middot; red = holding cash &middot; grey = pass-through &middot; dashed = unconfirmed</div>${trailSVG(tr)}`;});
}

let SELMETA=null;
async function selectCase(ack){SEL=ack;REPLAY_T=0;loadQueue();
  const q=await jget(`/queue?limit=60`);SELMETA=q.find(x=>x.ack_no===ack);
  const p=await jget(`/predict/${ack}`);renderBriefing(p);}

async function dispatch(ack,acc){const r=await jpost(`/alerts/dispatch?ack_no=${ack}&account=${acc}`);
  const f=$('flash');if(!f)return;
  f.textContent=r.deduped?'Deduplicated (alert for this account fired < 15 min ago).'
    :(r.dispatched&&r.dispatched.length)?'Sent: '+r.dispatched.map(a=>a.channel+' → '+a.recipient).join(', ')
    :'No alert (tier '+r.recommendation.tier+', below dispatch threshold).';}
async function loadAlerts(){const a=await jget('/alerts');
  $('stage').innerHTML=`<div class="card"><h3>Alert delivery log (${a.length})</h3>`+
    (a.length?a.map(x=>`<div class="loc"><span><span class="tier ${x.tier}" style="padding:2px 7px">${x.tier}</span>
      <span class="mono">${x.channel}</span> <small>→ ${x.recipient}</small><br><small>${x.subject}</small></span>
      <span class="p" style="color:var(--green)">${x.status}</span></div>`).join(''):'<div class="cap">No alerts yet.</div>')+
    `</div><br><button class="btn ghost" onclick="SEL&&selectCase(SEL)">&larr; back to case</button>`;}

// ---------- replay ----------
function togglePlay(){const b=$('playbtn');
  if(PLAY){clearInterval(PLAY);PLAY=null;if(b)b.innerHTML='&#9654; Replay';return;}
  if(!SEL)return;if(b)b.innerHTML='&#10073;&#10073; Pause';
  PLAY=setInterval(()=>{REPLAY_T+=3;if(REPLAY_T>120){togglePlay();return;}
    const sc=$('scrub');if(sc)sc.value=REPLAY_T;scrubTo(REPLAY_T);},420);}
async function scrubTo(t){REPLAY_T=+t;if(!SEL)return;
  const st=await jget(`/replay/state?case=${SEL}&t=${t}`);
  const p=st.prediction;p._trail=st.trail;
  const clk=`${st.as_of.slice(11,19)}`;
  renderBriefing(p, clk);
  const c=$('clock');if(c)c.textContent=clk;}

// ---------- init ----------
(async function(){await loadQueue();await loadHotspots();
  const it=await jget('/queue?limit=1');if(it.length)selectCase(it[0].ack_no);})();
</script>
</body>
</html>
